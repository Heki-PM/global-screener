name: Global Stock Screener

on:
  schedule:
    - cron: '0 15 * * 5'   # piątek 17:00 CEST / 16:00 CET
  workflow_dispatch:
    inputs:
      debug:
        description: 'Tryb DEBUG (powody odrzuceń w logach)'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run screener
        run: python scripts/screener.py
        env:
          PYTHONUNBUFFERED: "1"
          DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}

      - name: Verify output
        run: |
          if [ ! -f results/results.json ]; then
            echo "❌ BŁĄD: brak results/results.json"
            exit 1
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('results/results.json'))))")
          echo "✅ Sygnałów: ${COUNT}"
          cat results/meta.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || \
            git commit -m "📊 Screener $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: results/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
